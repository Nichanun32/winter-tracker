                    </div>
                    <button onClick={() => setWindMode('NE')} className={`px-2.5 py-1 rounded text-xs ${windMode === 'NE' ? 'bg-blue-600 text-white font-bold' : 'text-slate-600 bg-slate-100'}`}>เกณฑ์ NE (0-90°)</button>
                    <button onClick={() => setWindMode('NORTH')} className={`px-2.5 py-1 rounded text-xs ${windMode === 'NORTH' ? 'bg-blue-600 text-white font-bold' : 'text-slate-600 bg-slate-100'}`}>เกณฑ์ลมฝ่ายเหนือ (270-90°)</button>
                  </div>
                </div>

                <div className="overflow-x-auto max-h-[480px] border border-slate-200 rounded-xl bg-slate-50 text-xs scrollbar-thin">
                  <table className="w-full border-collapse">
                    <thead className="sticky top-0 bg-slate-200 text-slate-700 border-b border-slate-300 z-10">
                      <tr>
                        <th className="p-2.5 text-left sticky left-0 bg-slate-200 border-r border-slate-300 w-44">สถานี ({filteredStations.length})</th>
                        {DATA.days_meta.map((d, i) => <th key={i} className="p-2 text-center w-12 font-mono whitespace-nowrap">{d.label}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {filteredStations.map(st => (
                        <tr key={st.name} className="hover:bg-slate-100/80">
                          <td className="p-2 px-3 font-medium text-slate-800 sticky left-0 bg-white border-r border-slate-200 flex justify-between">
                            <span className="truncate max-w-[130px]">{st.name}</span>
                            <span className="text-[10px] text-slate-500 font-bold">{st.region}</span>
                          </td>
                          {st.winds && st.winds.map((deg, idx) => {
                            const pass = isWindPassingSurf(deg);
                            const arrowRotation = deg !== null && !isNaN(deg) ? (deg + 180) % 360 : 0;
                            return (
                              <td key={idx} className="p-1 text-center">
                                {deg !== null && !isNaN(deg) ? (
                                  <div
                                    title={`${deg}°`}
                                    className={`w-8 h-7 mx-auto flex items-center justify-center text-sm rounded ${pass ? 'text-cyan-700 font-bold bg-cyan-100 border border-cyan-300 shadow-[0_0_8px_rgba(6,182,212,0.45)]' : 'text-slate-400'}`}
                                  >
                                    <span style={{ display: 'inline-block', transform: `rotate(${arrowRotation}deg)` }}>↑</span>
                                  </div>
                                ) : <span className="text-slate-300 text-xs">-</span>}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'RAIN' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center text-xs text-slate-600">
                  <span>สัดส่วนสถานีปลอดฝน (&lt;1มม.) แยก 4 ภาค (ต.ค. - พ.ย.)</span>
                  <span>เกณฑ์ผ่านภาพรวม (N, NE) &ge; 60%</span>
                </div>

                <div className="space-y-2 max-h-[480px] overflow-y-auto pr-1 scrollbar-thin">
                  {statsWithStreak.map(d => {
                    if (d.pctFreeR === null) return null;
                    return (
                      <div key={d.idx} className="flex flex-col sm:flex-row sm:items-center gap-2 text-xs py-2.5 px-3.5 rounded-xl bg-slate-50 border border-slate-200">
                        <span className="w-16 text-slate-800 font-mono font-bold shrink-0">{d.label}</span>
                        <div className="flex flex-wrap items-center gap-2 text-xs flex-1">
                          <span className="px-2.5 py-1 rounded bg-white border border-slate-200 text-slate-700">เหนือ: <b className="text-blue-600">{d.regRain.N !== null ? d.regRain.N+'%' : '-'}</b></span>
                          <span className="px-2.5 py-1 rounded bg-white border border-slate-200 text-slate-700">อีสาน: <b className="text-blue-600">{d.regRain.NE !== null ? d.regRain.NE+'%' : '-'}</b></span>
                          <span className="px-2.5 py-1 rounded bg-white border border-slate-200 text-slate-700">กลาง: <b className="text-blue-600">{d.regRain.C !== null ? d.regRain.C+'%' : '-'}</b></span>
                          <span className="px-2.5 py-1 rounded bg-white border border-slate-200 text-slate-700">ตะวันออก: <b className="text-blue-600">{d.regRain.E !== null ? d.regRain.E+'%' : '-'}</b></span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0 w-60 justify-end">
                          <div className="w-28 h-3 bg-slate-200 rounded-full overflow-hidden flex">
                            <div className={`h-full ${d.iconPassR ? 'bg-emerald-500' : 'bg-amber-400'}`} style={{ width: `${d.pctFreeR}%` }} />
                          </div>
                          <span className={`font-mono font-bold w-14 text-right ${d.iconPassR ? 'text-emerald-600' : 'text-amber-600'}`}>{d.pctFreeR}%</span>
                          <span className="text-xs">{d.iconPassR ? '✅' : '❌'}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
